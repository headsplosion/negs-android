name: Android

on:
  workflow_dispatch:
  push:
    branches: [android]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Build the film engine
        run: |
          cargo install cargo-ndk --locked
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a --platform 29 -o android/app/src/main/jniLibs build --release -p nugs-android
      - name: Load the signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY || secrets.sign }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::warning::No signing key secret: this APK can't update an installed one."
            exit 0
          fi
          printf '%s' "$SIGNING_KEY" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/nugs.p12"
          keytool -list -keystore "$RUNNER_TEMP/nugs.p12" -storepass nugs-signing -alias nugs
          echo "NUGS_KEYSTORE=$RUNNER_TEMP/nugs.p12" >> "$GITHUB_ENV"
      - name: Build the APK
        run: gradle -p android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nugs-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
